name: Guarded MA Core Tests

on:
  push:
    branches: [main]
    paths:
      - 'scanner/ma_*.py'
      - 'scanner/asset_*.py'
      - 'scanner/bist_classification.py'
      - 'scanner/stock_metadata.py'
      - 'scanner/guarded_notifier.py'
      - 'scanner/notifier.py'
      - 'scanner/paper_tracker.py'
      - 'scanner/sr_baselines.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scanner/ma_*.py'
      - 'scanner/asset_*.py'
      - 'scanner/bist_classification.py'
      - 'scanner/stock_metadata.py'
      - 'scanner/guarded_notifier.py'
      - 'scanner/notifier.py'
      - 'scanner/paper_tracker.py'
      - 'scanner/sr_baselines.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install dev tools
        run: python -m pip install "ruff>=0.5,<1" "mypy>=1.10,<2"
      - name: Compile
        run: python -m compileall -q scanner tests
      - name: Ruff
        run: >-
          python -m ruff check
          scanner/ma_core.py scanner/ma_research_cli.py scanner/ma_validation.py
          scanner/paper_tracker.py scanner/asset_reporting.py scanner/guarded_notifier.py
          tests/test_ma_core.py tests/test_ma_research_cli.py
          tests/test_ma_validation.py tests/test_paper_tracker.py
      - name: Mypy
        run: >-
          python -m mypy --config-file pyproject.toml
          scanner/ma_validation.py scanner/paper_tracker.py
      - name: Unit and synthetic tests
        run: python -m unittest discover -s tests -v
