name: Guarded MA Core Tests

on:
  push:
    branches: [main]
    paths:
      - 'scanner/ma_*.py'
      - 'scanner/asset_*.py'
      - 'scanner/bist_classification.py'
      - 'scanner/stock_metadata.py'
      - 'scanner/guarded_notifier.py'
      - 'scanner/notifier.py'
      - 'scanner/sr_baselines.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scanner/ma_*.py'
      - 'scanner/asset_*.py'
      - 'scanner/bist_classification.py'
      - 'scanner/stock_metadata.py'
      - 'scanner/guarded_notifier.py'
      - 'scanner/notifier.py'
      - 'scanner/sr_baselines.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q scanner tests
      - name: Unit and synthetic tests
        run: python -m unittest discover -s tests -v
