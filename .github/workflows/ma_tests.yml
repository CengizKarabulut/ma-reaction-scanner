name: MA Trend ve Tepki Testleri

on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/ma_tests.yml"
  pull_request:
    paths:
      - "scanner/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/ma_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scanner/ma_engine.py scanner/ma_scan.py scanner/ma_notify.py scanner/ma_levels.py scanner/ma_relative.py
