name: Daily Guarded MA Scan

on:
  workflow_dispatch:
    inputs:
      universe:
        description: 'Hazır varlık evreni'
        required: true
        default: 'bist100_stocks'
        type: choice
        options:
          - bist30_stocks
          - bist50_stocks
          - bist100_stocks
          - bist_all_stocks
          - bist_sector_stocks
          - bist_bank_stocks
          - bist_technology_stocks
          - bist_food_stocks
          - bist_chemistry_stocks
          - bist_main_indices
          - bist_sector_indices
          - bist_all_indices
          - crypto_majors
          - commodities_majors
          - custom
      sector:
        description: 'Yalnız bist_sector_stocks için; diğer evrenlerde Tümü / uygulanmaz'
        required: true
        default: 'Tümü / uygulanmaz'
        type: choice
        options:
          - Tümü / uygulanmaz
          - Bankacılık
          - Teknoloji
          - Gıda ve İçecek
          - Kimya, Petrol ve Plastik
          - Holding ve Yatırım
          - Sigorta
          - Turizm
          - Elektrik
          - İletişim
          - İnşaat
          - Madencilik
          - Metal Ana
          - Spor
          - Tekstil ve Deri
          - Ulaştırma
          - Sınai
          - Mali
      custom_asset_class:
        description: 'Yalnızca custom için varlık sınıfı'
        required: true
        default: 'stock'
        type: choice
        options: [stock, index, sector_index, crypto, commodity]
      custom_market:
        description: 'Yalnızca custom için piyasa'
        required: true
        default: 'BIST'
        type: choice
        options: [BIST, GLOBAL]
      custom_symbols:
        description: 'Yalnızca custom için virgülle semboller'
        required: false
        default: 'THYAO'
      interval:
        description: 'Tek zaman dilimi'
        required: true
        default: '1d'
        type: choice
        options: [1h, 4h, 1d, 1wk, 1mo]
      periods:
        description: 'MA periyotları'
        required: true
        default: '5,8,13,20,21,22,34,55,89,100,144,200,233,377'
      source:
        description: 'Veri kaynağı'
        required: true
        default: 'auto'
        type: choice
        options: [auto, borsapy, yfinance]
      top:
        description: 'Taraf/zaman dilimi başına ayrıntı adayı'
        required: true
        default: '5'
      null_iterations:
        description: 'Kanit null iterasyonu'
        required: true
        default: '499'
      behavior_min_touches:
        description: 'Davranis tablolari icin minimum temas'
        required: true
        default: '10'

permissions:
  contents: read

jobs:
  guarded-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INPUT_UNIVERSE: ${{ inputs.universe }}
      INPUT_SECTOR: ${{ inputs.sector }}
      INPUT_ASSET_CLASS: ${{ inputs.custom_asset_class }}
      INPUT_MARKET: ${{ inputs.custom_market }}
      INPUT_SYMBOLS: ${{ inputs.custom_symbols }}
      INPUT_INTERVAL: ${{ inputs.interval }}
      INPUT_PERIODS: ${{ inputs.periods }}
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_TOP: ${{ inputs.top }}
      INPUT_NULL_ITERATIONS: ${{ inputs.null_iterations }}
      INPUT_BEHAVIOR_MIN_TOUCHES: ${{ inputs.behavior_min_touches }}
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt
      - name: Guarded günlük tarama
        shell: bash
        run: |
          python -m scanner.ma_research_cli \
            --universe "$INPUT_UNIVERSE" \
            --sector "$INPUT_SECTOR" \
            --asset-class "$INPUT_ASSET_CLASS" \
            --market "$INPUT_MARKET" \
            --tickers "$INPUT_SYMBOLS" \
            --timeframes "$INPUT_INTERVAL" \
            --periods "$INPUT_PERIODS" \
            --source "$INPUT_SOURCE" \
            --top "$INPUT_TOP" \
            --null-iterations "$INPUT_NULL_ITERATIONS" \
            --behavior-min-touches "$INPUT_BEHAVIOR_MIN_TOUCHES" \
            --active-only \
            --output-dir reports/daily
      - name: Telegram tekilleştirilmiş özet
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scanner.guarded_notifier \
            --summary reports/daily/instrument_summary.csv \
            --label "Daily Guarded MA (${{ inputs.interval }})" \
            --top 20 \
            --behavior-min-touches "$INPUT_BEHAVIOR_MIN_TOUCHES"
        continue-on-error: true
      - name: Betimsel MA saygi ek listesi
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python -m scanner.guarded_descriptive_bridge \
            --summary reports/daily/instrument_summary.csv \
            --behavior-dir reports/daily \
            --output-dir reports/daily/descriptive_highlights \
            --label "Daily Ek Liste MA Saygi (${{ inputs.interval }})" \
            --timeframe "$INPUT_INTERVAL" \
            --periods "$INPUT_PERIODS" \
            --source "$INPUT_SOURCE" \
            --behavior-min-touches "$INPUT_BEHAVIOR_MIN_TOUCHES" \
            --max-symbols 20 \
            --top 20 \
            --detail-top 20 \
            --telegram
        continue-on-error: true
      - name: Denetlenebilir çıktıları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-guarded-ma-${{ github.run_id }}
          path: |
            reports/daily/
            data_cache/
          retention-days: 90
          if-no-files-found: warn
