name: MA Market Scan Watchdog
run-name: "MA Watchdog · ${{ inputs.timeframe || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Manuel watchdog zaman dilimi"
        required: true
        default: "1h"
        type: choice
        options: [1h, 4h, 1d, 1wk]

permissions:
  actions: write
  contents: read

concurrency:
  group: ma-market-scan-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Manuel MA watchdog testi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: ma_market_scan.yml
          TIMEFRAME: ${{ inputs.timeframe }}
        shell: bash
        run: |
          set -euo pipefail

          case "${TIMEFRAME}" in
            1h|4h|1d|1wk) ;;
            *)
              echo "Desteklenmeyen zaman dilimi: ${TIMEFRAME}"
              exit 1
              ;;
          esac

          active_count="$(
            gh api "repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=40" |
              jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"

          if [ "${active_count}" -gt 0 ]; then
            echo "Ana MA taramasi zaten aktif; yeni kosu yok."
            exit 0
          fi

          echo "Manuel watchdog ${TIMEFRAME} MA taramasini baslatiyor."
          gh workflow run "${TARGET_WORKFLOW}" \
            --repo "${REPOSITORY}" \
            --ref main \
            -f timeframe_preset="${TIMEFRAME}"
