name: Sektör Cache Oluştur

# borsapy v0.10+ ile her BIST hissesinin sektör bilgisini çeker ve cache'ler.
# yfinance backend'e fallback (borsapy fail olursa).
# Cache repo'ya commit edilir, BIST_SEKTOR:xxx grup adıyla kullanılır.
# Ayda 1 manuel çalıştırmak yeterli.

on:
  workflow_dispatch:
    inputs:
      tickers_source:
        description: 'Hangi listeyi tarayacağız?'
        required: false
        default: 'BIST_TUM'
        type: choice
        options:
          - BIST_TUM
          - BIST_100
          - BIST_50
          - BIST_30
      commit_cache:
        description: 'Cache dosyasını repo''ya commit et'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sektör Cache Oluştur (borsapy v0.10 backend)
        run: |
          cd scanner
          # Ticker listesini al
          python -c "
          from tickers import get_tickers
          tickers = get_tickers('${{ github.event.inputs.tickers_source || 'BIST_TUM' }}')
          with open('/tmp/tickers.txt', 'w') as f:
              for t in tickers:
                  f.write(t + '\n')
          print(f'Toplam {len(tickers)} hisse')
          "

          # Cache oluştur
          python sector_resolver.py --build-cache --tickers-file /tmp/tickers.txt

      - name: Sektör Dağılımı
        run: |
          cd scanner
          python sector_resolver.py --stats

      - name: Borsapy Sektör Listesi
        run: |
          cd scanner
          echo "=== borsapy.sectors() (53 sektör) ==="
          python sector_resolver.py --list-sectors || true
          echo ""
          echo "=== borsapy.all_indices() (79 endeks) ==="
          python sector_resolver.py --list-indices || true

      - name: Cache dosyaları
        run: ls -la scanner/.cache/ || true

      - name: Repo'ya commit
        if: ${{ github.event.inputs.commit_cache != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner/.cache/sectors_cache.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Sektör cache güncelle: $(date +%Y-%m-%d)"
            git push
          fi

      - name: Telegram bildirim
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🏗 Sektör Cache Güncellendi (borsapy v0.10)%0A%0ABIST hisseleri için sektör bilgisi çekildi.%0A%0AKullanım: 'BIST_SEKTOR:Bankacılık' veya 'BIST_BILES:XBANK'"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG" || true
        continue-on-error: true
