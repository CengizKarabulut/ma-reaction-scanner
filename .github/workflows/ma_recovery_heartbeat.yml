name: MA Recovery Heartbeat
run-name: "MA Recovery · ${{ inputs.timeframe || github.event_name }}"

# Otomatik taramalar ma_market_scan.yml icindeki kesin slotlardan calisir.
# Bu dosya artik yalnizca gerektiğinde manuel kurtarma icindir; otomatik ek
# tarama uretmez.
on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Manuel kurtarma zaman dilimi"
        required: true
        default: "1h"
        type: choice
        options: [1h, 4h, 1d, 1wk]

permissions:
  actions: write
  contents: read

concurrency:
  group: ma-recovery-heartbeat
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Manuel MA kurtarma taramasini baslat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: ma_market_scan.yml
          TIMEFRAME: ${{ inputs.timeframe }}
        shell: bash
        run: |
          set -euo pipefail

          case "${TIMEFRAME}" in
            1h|4h|1d|1wk) ;;
            *)
              echo "Desteklenmeyen zaman dilimi: ${TIMEFRAME}"
              exit 1
              ;;
          esac

          active_count="$(
            gh api "repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=50" |
              jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"

          if [ "${active_count}" -gt 0 ]; then
            echo "Ana MA taramasi halen aktif (${active_count}); manuel kurtarma baslatilmadi."
            exit 0
          fi

          echo "${TIMEFRAME} manuel kurtarma taramasi baslatiliyor."
          gh workflow run "${TARGET_WORKFLOW}" \
            --repo "${REPOSITORY}" \
            --ref main \
            -f timeframe_preset="${TIMEFRAME}"
