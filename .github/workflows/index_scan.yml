name: BIST Endeks Tarama

# BIST endekslerinin KENDİSİNİ tarar (bileşenlerini değil)
# XBANK endeksi (12000 puan) kendi MA'larına saygı duyuyor mu?
# Makro trend filtresi için kullanılır.
#
# Tam pipeline: tarama + strategy + backtest + multi-indicator confirm + zengin Telegram

on:
  schedule:
    - cron: '30 16 * * 1-5'   # 19:30 İstanbul, hafta içi (daily scan'den 1 saat sonra)
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Endeks listesi seç'
        required: false
        default: 'BIST_ENDEKSLER'
        type: choice
        options:
          - BIST_ENDEKSLER           # 4 ana endeks (hızlı test)
          - BIST_ENDEKSLER_GENIS     # 36 endeks (sektörler dahil)
          - BIST_TUM_ENDEKSLER       # 79 endeks (borsapy dinamik)
      period:
        description: 'Veri periyodu'
        required: false
        default: '5y'
      interval:
        description: 'Zaman dilimi: 1h, 4h, 1d, 1wk, 1mo'
        required: false
        default: '1d'
        type: choice
        options:
          - 1h
          - 4h
          - 1d
          - 1wk
          - 1mo
      source:
        description: 'Veri kaynağı'
        required: false
        default: 'borsapy'
        type: choice
        options:
          - borsapy
          - yfinance
      no_walk_forward:
        description: 'Walk-forward atla (hızlı test)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarih hazırla
        id: prep
        run: |
          TS=$(date +'%Y-%m-%d')
          echo "ts=$TS" >> $GITHUB_OUTPUT
          mkdir -p reports

      - name: Walk-forward bayrağı ayarla
        id: wf
        run: |
          if [ "${{ github.event.inputs.no_walk_forward || 'false' }}" = "true" ]; then
            echo "wf_arg=--no_walk_forward" >> $GITHUB_OUTPUT
          else
            echo "wf_arg=" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # STEP 1: ENDEKS TARAMA — BIST_ENDEKSLER grubu (35+ endeks)
      # ============================================================
      - name: 1️⃣ Endeks Tarama (MA-Saygı)
        run: |
          python scanner/bist_ma_reaction_scanner.py \
            --all-bist --bist-list ${{ github.event.inputs.tickers || 'BIST_ENDEKSLER' }} \
            --source ${{ github.event.inputs.source || 'borsapy' }} \
            --interval ${{ github.event.inputs.interval || '1d' }} \
            --period ${{ github.event.inputs.period || '5y' }} \
            ${{ steps.wf.outputs.wf_arg }} \
            --output reports/index_scan_${{ steps.prep.outputs.ts }}.csv \
            --report html --top_n 20 \
            --min_touches 8

      # ============================================================
      # STEP 2: STRATEJİ RAPORU (her endeks için fiyat + MA değer + cluster)
      # ============================================================
      - name: 2️⃣ Endeks Stratejileri (cluster + DESTEK/DIRENC)
        run: |
          python scanner/strategy_generator.py \
            --csv reports/index_scan_${{ steps.prep.outputs.ts }}.csv \
            --all-robust --top_ma 5 \
            --portfolio 100000 \
            --output reports/index_strategies_${{ steps.prep.outputs.ts }}.html
        continue-on-error: true

      # ============================================================
      # STEP 3: BACKTEST (her robust endeks MA için tarihi PnL)
      # ============================================================
      - name: 3️⃣ Endeks Backtest (tarihi performans)
        run: |
          python scanner/backtest_simulator.py \
            --csv reports/index_scan_${{ steps.prep.outputs.ts }}.csv \
            --all-robust --top_ma 3 \
            --portfolio 100000 \
            --output reports/index_backtest_${{ steps.prep.outputs.ts }}.html
        continue-on-error: true

      # ============================================================
      # STEP 4: MULTI-INDICATOR CONFIRMATION
      # (her endeksin RSI/MACD/BB/İchimoku/OBV/SMI durumu)
      # ============================================================
      - name: 4️⃣ Multi-Indicator Confirmation (RSI/MACD/BB/...)
        run: |
          python scanner/multi_indicator_confirm.py \
            --csv reports/index_scan_${{ steps.prep.outputs.ts }}.csv \
            --all-robust --n_tickers 20 \
            --output reports/index_confirm_${{ steps.prep.outputs.ts }}.html
        continue-on-error: true

      # ============================================================
      # STEP 4.5: BIST PANORAMA — Tüm endeksler tam tablo
      # ============================================================
      - name: 4.5️⃣ Panorama Raporu (tüm endeksler)
        if: success()
        run: |
          python scanner/panorama_report.py \
            --csv reports/index_scan_${{ steps.prep.outputs.ts }}.csv \
            --output reports/index_panorama_${{ steps.prep.outputs.ts }}.html
        continue-on-error: true

      # ============================================================
      # STEP 5: ZENGIN TELEGRAM ÖZETİ (notifier ile — fiyat + MA değer + 🟢🔴)
      # ============================================================
      - name: 5️⃣ Telegram Zengin Özet
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Endeks tarama: TÜM endeksleri göster (top_setups=0 → hepsi)
          python scanner/notifier.py \
            --csv reports/index_scan_${{ steps.prep.outputs.ts }}.csv \
            --label "BIST Endeks Tarama" \
            --top_setups 0 \
            --top_stocks 0 \
            --mode daily
        continue-on-error: true

      # ============================================================
      # STEP 6: ARTIFACT
      # ============================================================
      - name: 6️⃣ Artifact yükle (tüm raporlar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-scan-${{ steps.prep.outputs.ts }}
          path: reports/index*
          retention-days: 90
