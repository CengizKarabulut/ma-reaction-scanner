name: MA Reaction Scheduler Keepalive

on:
  # LEGACY: no automatic dispatch while the guarded core is prospectively validated.
  workflow_dispatch:

concurrency:
  group: ma-reaction-keepalive
  cancel-in-progress: false

jobs:
  scheduler:
    if: ${{ false }} # Archived: must not dispatch unvalidated legacy workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Due workflowlari tetikle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          dispatch() {
            local event_type="$1"
            echo "Dispatch: ${event_type}"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/dispatches" \
              --data "{\"event_type\":\"${event_type}\"}"
          }

          is_due() {
            local target_dow="$1"
            local target_hour="$2"
            local target_minute="$3"
            local now_dow now_hour now_minute now_total target_total diff

            now_dow="$(date -u +%u)"
            now_hour="$(date -u +%H)"
            now_minute="$(date -u +%M)"

            if [ "${target_dow}" != "*" ] && [ "${now_dow}" != "${target_dow}" ]; then
              return 1
            fi

            now_total=$((10#${now_hour} * 60 + 10#${now_minute}))
            target_total=$((10#${target_hour} * 60 + 10#${target_minute}))
            diff=$((now_total - target_total))

            [ "${diff}" -ge 0 ] && [ "${diff}" -lt 15 ]
          }

          is_weekday() {
            local dow
            dow="$(date -u +%u)"
            [ "${dow}" -ge 1 ] && [ "${dow}" -le 5 ]
          }

          # Cron saatleri UTC'dir. Yorumlardaki Istanbul saati UTC+3'e gore yazildi.
          if is_due 1 03 00; then
            dispatch "ma-update-bist-lists"
          fi

          if is_weekday && is_due "*" 15 30; then
            dispatch "ma-daily-scan"
          fi

          if is_weekday && is_due "*" 16 30; then
            dispatch "ma-index-scan"
          fi

          if is_due 6 07 00; then
            dispatch "ma-weekly-robustness"
            dispatch "ma-multi-tf-cascade"
          fi

      - name: Sonraki keepalive tick
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          now="$(date -u +%s)"
          next="$(( ((now / 900) + 1) * 900 + 60 ))"
          sleep_seconds="$(( next - now ))"
          if [ "${sleep_seconds}" -lt 60 ]; then
            sleep_seconds="$(( sleep_seconds + 900 ))"
          fi

          echo "Sonraki keepalive ${sleep_seconds} saniye sonra tetiklenecek."
          sleep "${sleep_seconds}"

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            --data '{"event_type":"ma-keepalive-tick"}'
