name: Guarded Single Instrument Analysis

on:
  workflow_dispatch:
    inputs:
      asset_class:
        description: 'Varlık sınıfı'
        required: true
        default: 'stock'
        type: choice
        options: [stock, index, sector_index, crypto, commodity]
      market:
        description: 'Piyasa'
        required: true
        default: 'BIST'
        type: choice
        options: [BIST, GLOBAL]
      symbol:
        description: 'Tek sembol: GARAN, XU100, XBANK, BTC-USD veya GC=F'
        required: true
        default: 'ASELS'
      timeframes:
        description: 'Zaman dilimleri'
        required: true
        default: '1d'
        type: choice
        options: [1h, 4h, 1d, 1wk, 1mo, '4h,1d', '1d,1wk', '1d,1wk,1mo']
      periods:
        description: 'MA periyotları'
        required: true
        default: '5,8,13,21,22,34,50,55,89,100,144,200,233,377'
      source:
        description: 'Veri kaynağı'
        required: true
        default: 'auto'
        type: choice
        options: [auto, borsapy, yfinance]
      top:
        description: 'Taraf/zaman dilimi başına ayrıntı adayı'
        required: true
        default: '5'
      null_iterations:
        description: 'Eşleştirilmiş rastgele kontrol sayısı'
        required: true
        default: '499'

permissions:
  contents: read

jobs:
  guarded-single:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INPUT_ASSET_CLASS: ${{ inputs.asset_class }}
      INPUT_MARKET: ${{ inputs.market }}
      INPUT_SYMBOL: ${{ inputs.symbol }}
      INPUT_TIMEFRAMES: ${{ inputs.timeframes }}
      INPUT_PERIODS: ${{ inputs.periods }}
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_TOP: ${{ inputs.top }}
      INPUT_NULL_ITERATIONS: ${{ inputs.null_iterations }}
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt
      - name: Guarded tek varlık analizi
        shell: bash
        run: |
          python -m scanner.ma_research_cli \
            --universe custom \
            --asset-class "$INPUT_ASSET_CLASS" \
            --market "$INPUT_MARKET" \
            --tickers "$INPUT_SYMBOL" \
            --timeframes "$INPUT_TIMEFRAMES" \
            --periods "$INPUT_PERIODS" \
            --source "$INPUT_SOURCE" \
            --top "$INPUT_TOP" \
            --null-iterations "$INPUT_NULL_ITERATIONS" \
            --active-only \
            --output-dir reports/single
      - name: Telegram tek varlık özeti
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scanner.guarded_notifier \
            --summary reports/single/instrument_summary.csv \
            --label "Guarded Tek Varlık: ${{ inputs.symbol }}" \
            --top 1
        continue-on-error: true
      - name: Denetlenebilir çıktıları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-single-${{ inputs.symbol }}-${{ github.run_id }}
          path: |
            reports/single/
            data_cache/
          retention-days: 90
          if-no-files-found: warn
