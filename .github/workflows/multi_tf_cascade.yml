name: Guarded Multi-Timeframe Scan

on:
  workflow_dispatch:
    inputs:
      universe:
        description: 'Hazır varlık evreni'
        required: true
        default: 'bist100_stocks'
        type: choice
        options:
          - bist30_stocks
          - bist50_stocks
          - bist100_stocks
          - bist_all_stocks
          - bist_sector_stocks
          - bist_bank_stocks
          - bist_technology_stocks
          - bist_food_stocks
          - bist_chemistry_stocks
          - bist_main_indices
          - bist_sector_indices
          - bist_all_indices
          - crypto_majors
          - commodities_majors
          - custom
      sector:
        description: 'Yalnız bist_sector_stocks için; diğer evrenlerde Tümü / uygulanmaz'
        required: true
        default: 'Tümü / uygulanmaz'
        type: choice
        options:
          - Tümü / uygulanmaz
          - Bankacılık
          - Teknoloji
          - Gıda ve İçecek
          - Kimya, Petrol ve Plastik
          - Holding ve Yatırım
          - Sigorta
          - Turizm
          - Elektrik
          - İletişim
          - İnşaat
          - Madencilik
          - Metal Ana
          - Spor
          - Tekstil ve Deri
          - Ulaştırma
          - Sınai
          - Mali
      custom_asset_class:
        description: 'Yalnızca custom için varlık sınıfı'
        required: true
        default: 'stock'
        type: choice
        options: [stock, index, sector_index, crypto, commodity]
      custom_market:
        description: 'Yalnızca custom için piyasa'
        required: true
        default: 'BIST'
        type: choice
        options: [BIST, GLOBAL]
      custom_symbols:
        description: 'Yalnızca custom için virgülle semboller'
        required: false
        default: 'THYAO'
      cascade_type:
        description: 'Daily: 1d+1wk+1mo, Intraday: 1h+4h+1d'
        required: true
        default: 'daily'
        type: choice
        options: [daily, intraday]
      periods:
        description: 'MA periyotları'
        required: true
        default: '20,50,100,200'
      source:
        description: 'Veri kaynağı'
        required: true
        default: 'auto'
        type: choice
        options: [auto, borsapy, yfinance]
      top:
        description: 'Taraf/zaman dilimi başına ayrıntı adayı'
        required: true
        default: '5'
      null_iterations:
        description: 'Eşleştirilmiş rastgele kontrol sayısı'
        required: true
        default: '499'

permissions:
  contents: read

jobs:
  guarded-multi-timeframe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      INPUT_UNIVERSE: ${{ inputs.universe }}
      INPUT_SECTOR: ${{ inputs.sector }}
      INPUT_ASSET_CLASS: ${{ inputs.custom_asset_class }}
      INPUT_MARKET: ${{ inputs.custom_market }}
      INPUT_SYMBOLS: ${{ inputs.custom_symbols }}
      INPUT_PERIODS: ${{ inputs.periods }}
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_TOP: ${{ inputs.top }}
      INPUT_NULL_ITERATIONS: ${{ inputs.null_iterations }}
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt
      - name: Zaman dilimlerini seç
        id: cascade
        shell: bash
        run: |
          if [ "${{ inputs.cascade_type }}" = "intraday" ]; then
            echo "timeframes=1h,4h,1d" >> "$GITHUB_OUTPUT"
          else
            echo "timeframes=1d,1wk,1mo" >> "$GITHUB_OUTPUT"
          fi
      - name: Guarded çoklu zaman dilimi taraması
        shell: bash
        run: |
          python -m scanner.ma_research_cli \
            --universe "$INPUT_UNIVERSE" \
            --sector "$INPUT_SECTOR" \
            --asset-class "$INPUT_ASSET_CLASS" \
            --market "$INPUT_MARKET" \
            --tickers "$INPUT_SYMBOLS" \
            --timeframes "${{ steps.cascade.outputs.timeframes }}" \
            --periods "$INPUT_PERIODS" \
            --source "$INPUT_SOURCE" \
            --top "$INPUT_TOP" \
            --null-iterations "$INPUT_NULL_ITERATIONS" \
            --output-dir reports/multi_tf
      - name: Telegram tekilleştirilmiş özet
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scanner.guarded_notifier \
            --summary reports/multi_tf/instrument_summary.csv \
            --label "Guarded Multi-TF (${{ inputs.cascade_type }})" \
            --top 20
        continue-on-error: true
      - name: Denetlenebilir çıktıları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-multi-tf-${{ github.run_id }}
          path: |
            reports/multi_tf/
            data_cache/
          retention-days: 90
          if-no-files-found: warn
